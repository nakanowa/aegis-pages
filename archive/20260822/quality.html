<style>

button{width:100%;background:#6366f1;color:#fff;border:none;border-radius:8px;
       padding:11px;font-size:0.95rem;font-weight:600;cursor:pointer}
button:hover{background:#818cf8}
.err{color:#f87171;font-size:0.8rem;margin-top:10px;display:none}
.wait{color:#64748b;font-size:0.8rem;margin-top:10px;display:none}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(pw, fromStore){
  const err = document.getElementById("err"), wait = document.getElementById("wait");
  if(err) err.style.display = "none";
  if(wait) wait.style.display = "block";
  try{
    const html = await decrypt(pw);
    sessionStorage.setItem("aegis_pw", pw);
    document.open(); document.write(html); document.close();
  }catch(e){
    if(wait) wait.style.display = "none";
    if(!fromStore && err) err.style.display = "block";
    else if(fromStore) sessionStorage.removeItem("aegis_pw");
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  unlock(document.getElementById("pw").value, false);
});
const saved = sessionStorage.getItem("aegis_pw");
if(saved){ unlock(saved, true); }
